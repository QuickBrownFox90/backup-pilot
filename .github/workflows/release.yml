name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Build plugin ZIP
        run: |
          mkdir -p /tmp/backup-pilot
          rsync -r \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='*.md' \
            --exclude='*.txt' \
            ./ /tmp/backup-pilot/backup-pilot/
          cd /tmp/backup-pilot
          zip -r backup-pilot.zip backup-pilot/

      - name: Attach ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/backup-pilot/backup-pilot.zip
